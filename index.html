<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little One</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Little One">
  <meta name="theme-color" content="#FBF7F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141A" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">

<body>
  <main id="app"></main>
  <nav id="nav" class="nav" hidden>
    <button data-act="tab" data-tab="home">Today</button>
    <button data-act="tab" data-tab="history">History</button>
    <button data-act="tab" data-tab="settings">Settings</button>
  </nav>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>

</html>
