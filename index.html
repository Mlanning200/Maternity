<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lil Chicken</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lil Chicken">
  <meta name="theme-color" content="#FFF8EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17120D" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Pick light/dark before first paint (same rule as the app: Auto = dark at night or when the iPhone is dark).
    (function () {
      var p = 'auto'; try { p = localStorage.getItem('mt.theme') || 'auto'; } catch (e) {}
      var d = new Date(), h = d.getHours() + d.getMinutes() / 60;
      var dark = p === 'dark' || (p === 'auto' && (matchMedia('(prefers-color-scheme: dark)').matches || h >= 21 || h < 6.5));
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"></main>
  <nav id="nav" class="nav" hidden></nav>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
